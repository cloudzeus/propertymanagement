# PgBouncer in front of the production PostgreSQL — runs on the DB VM next to Postgres.
# Spec: docs/superpowers/specs/2026-10-23-pgbouncer-design.md · steps: README.md (same folder)
#
# All values come from `.env` in this folder (copy pgbouncer.env.example → .env, fill it in).
# The image renders /etc/pgbouncer/pgbouncer.ini and userlist.txt from these variables at
# start-up (see pgbouncer.ini.example for the result). Nothing secret lives in this file.
services:
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    container_name: pgbouncer
    restart: unless-stopped
    env_file: .env
    environment:
      # ── upstream PostgreSQL (from .env) ──────────────────────────────────────
      DB_HOST: ${DB_HOST:?set DB_HOST in .env}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?set DB_NAME in .env}
      DB_USER: ${DB_USER:?set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # ── listener / auth ──────────────────────────────────────────────────────
      LISTEN_PORT: "6432"
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${DB_USER}
      STATS_USERS: ${DB_USER}
      # ── pooling (defaults = spec §4; override in .env if needed) ─────────────
      POOL_MODE: ${POOL_MODE:-transaction}
      MAX_CLIENT_CONN: ${MAX_CLIENT_CONN:-500}
      DEFAULT_POOL_SIZE: ${DEFAULT_POOL_SIZE:-20}
      MIN_POOL_SIZE: ${MIN_POOL_SIZE:-2}
      RESERVE_POOL_SIZE: ${RESERVE_POOL_SIZE:-5}
      RESERVE_POOL_TIMEOUT: ${RESERVE_POOL_TIMEOUT:-3}
      MAX_DB_CONNECTIONS: ${MAX_DB_CONNECTIONS:-40}
      SERVER_IDLE_TIMEOUT: ${SERVER_IDLE_TIMEOUT:-300}
      SERVER_LIFETIME: ${SERVER_LIFETIME:-3600}
      IDLE_TRANSACTION_TIMEOUT: ${IDLE_TRANSACTION_TIMEOUT:-60}
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      # ── logging (quiet by default; set LOG_CONNECTIONS=1 while debugging) ────
      LOG_CONNECTIONS: ${LOG_CONNECTIONS:-0}
      LOG_DISCONNECTIONS: ${LOG_DISCONNECTIONS:-0}
      LOG_POOLER_ERRORS: "1"
      LOG_STATS: ${LOG_STATS:-0}
    ports:
      # Bind ONLY on the VM's Tailscale IP so :6432 is never public.
      - "${PGBOUNCER_BIND:?set PGBOUNCER_BIND (the VM's Tailscale IP) in .env}:6432:6432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U $${DB_USER} -d $${DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
